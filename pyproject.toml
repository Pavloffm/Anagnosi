[project]
name = "anagnosi"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "torch (>=2.11.0,<3.0.0)",
    "transformers (>=5.3.0,<6.0.0)",
    "chromadb (>=1.5.5,<2.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "langchain-text-splitters (>=1.1.1,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-huggingface (>=1.2.1,<2.0.0)",
    "sentence-transformers (>=5.3.0,<6.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "typer (>=0.24.1,<0.25.0)",
    "rich (>=14.3.3,<15.0.0)"
]

[tool.poetry]
name = "anagnosi"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.scripts]
anagnosi = "anagnosi.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {version = ">=2.11.0,<3.0.0", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
ruff = "^0.9.0"
pre-commit = "^4.5.1"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", ]
ignore = ["E501", "E701"]